name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils libfuse2
      - run: node scripts/check-version.mjs
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Rust tests (macOS / Linux)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust tests (Windows)
        if: runner.os == 'Windows'
        # Keep the 100,011-file filesystem test from competing with shell startup.
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - run: npm run bundle
      - run: node scripts/prepare-release-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: free-code-editor-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: free-code-editor-*
          merge-multiple: true
          path: release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- *.exe *.msi *.deb *.AppImage *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/releases/${TAG}.md"
          gh release create "$TAG" release-assets/* --verify-tag --title "Free Code Editor ${TAG#v}" --notes-file "docs/releases/${TAG}.md" --latest
