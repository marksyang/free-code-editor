[package]
name = "free-code-editor"
version = "1.0.1"
edition = "2021"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
sha2 = "0.10"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
